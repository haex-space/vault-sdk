[package]
name = "haex-bundle"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "The extension bundle format haextension-bundle/2: reading, writing, signing and verifying .xt archives"
repository = "https://github.com/haex-space/vault-sdk"
publish = false

# The one implementation of the bundle format. Hosts (holzi) use it natively;
# the `haex` tool of this SDK uses its WebAssembly build (feature `wasm`,
# `scripts/build-bundle-wasm.mjs`).

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
crc32fast = "1.5"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
unicode-normalization = "0.1"
wasm-bindgen = { version = "=0.2.129", optional = true }

[dev-dependencies]
serde_json = "1.0"

# Size of the WebAssembly build, which the SDK embeds in its package.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
