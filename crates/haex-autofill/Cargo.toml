[package]
name = "haex-autofill"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "The autofill rule of haex-pass: which field of a web form gets which field of a password-manager entry"
repository = "https://github.com/haex-space/vault-sdk"
publish = false

# The one implementation of the autofill rule. Hosts (holzi) use it natively;
# the browser extension haex-pass-browser uses its WebAssembly build (feature `wasm`).

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }

[dev-dependencies]
serde_json = "1.0"

# Size of the WebAssembly build.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
