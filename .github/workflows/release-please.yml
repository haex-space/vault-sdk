name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens / updates a "release PR" that bumps version + CHANGELOG.md based
      # on Conventional Commits since the last release. Merging that PR causes
      # this action's next run to create the tag and GitHub release — which in
      # turn fires release.yml (npm publish on tag push).
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
