name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # contents:read is the default, listed here so the diff with the previous
      # GitHub-release-creating version is intentional. id-token:write is for
      # npm OIDC.
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # GitHub release + changelog are owned by release-please
      # (.github/workflows/release-please.yml). This workflow only needs to
      # publish the npm artifact once the tag for that release lands.
      #
      # Authentication uses npm's OIDC trusted-publishing — see the package
      # settings on npmjs.com. The id-token:write permission above is what
      # lets the CLI exchange the workflow's OIDC token for an npm publish
      # token, so no NPM_TOKEN secret is needed.
      #
      # We explicitly call `npm publish` (not `pnpm publish`) after bumping
      # npm to >=11.5.1 because that's the version that knows how to do the
      # OIDC exchange. Node 22 ships with npm 10.x which only signs the
      # provenance attestation but still wants a static token for the upload
      # itself — that fails as a misleading 404.
      - name: Publish to npm
        # `npx --yes npm@latest` avoids the cross-major-version self-upgrade
        # bug ("Cannot find module 'promise-retry'") that hits a plain
        # `npm install -g npm@latest` on Node 22 / bundled npm 10.x.
        run: npx --yes npm@latest publish --access public --provenance
